# XGBoost Baseline Configuration
# Purpose: Fast training with reasonable performance
name: baseline
type: xgboost
# Model hyperparameters
parameters:
  n_estimators: 50
  max_depth: 3
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  objective: reg:squarederror
  random_state: 42
  n_jobs: -1
# Training parameters
training:
  early_stopping_rounds: 20
  verbose: True
# Feature engineering
features:
  use_haversine: true
  use_temporal: true
  use_weather_encoding: true
# Expected performance (baseline)
expected_performance:
  train_rmse: "~4.5-5.0 minutes"
  val_rmse: "~5.0-5.5 minutes"
  val_r2: "~0.70-0.75"
