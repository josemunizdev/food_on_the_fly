# XGBoost Optimized Configuration
# Purpose: Best performance, longer training time
name: optimized
type: xgboost
# Model hyperparameters
parameters:
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.7
  colsample_bytree: 0.7
  gamma: 0.1
  min_child_weight: 3
  objective: reg:squarederror
  random_state: 42
  n_jobs: -1

training:
  early_stopping_rounds: 30
  verbose: True

features:
  use_haversine: true
  use_temporal: true
  use_weather_encoding: true
  use_polynomial_features: false # Can be enabled for more complex relationships

expected_performance:
  train_rmse: "~3.8-4.2 minutes"
  val_rmse: "~4.0-4.5 minutes"
  val_r2: "~0.78-0.83"
