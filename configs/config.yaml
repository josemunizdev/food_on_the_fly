# Hydra configuration for Food on the Fly
defaults:
  - model: xgboost_baseline
  - _self_

mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "food_delivery_prediction"
  run_name: "xgboost_${model.name}_${model.parameters.n_estimators}_d${model.parameters.max_depth}_lr${model.parameters.learning_rate}"

evaluation:
  run_id: null #Set to specific run_id to evaluate that run, or null for latest
  selection_mode: "latest" # Options: "latest", "best", "specific"
  best_metric: "val_rmse" #Metric to use for determining "best"
  best_metric_order: "min" # "min" for metrics like RMSE, "max" for metrics like accuracy

data:
  # Single source of truth for the raw dataset. Works locally (with
  # `gcloud auth application-default login`) and in cloud (via the
  # runtime service account). Override at the CLI with
  # data.source_uri=<path> for offline / dev work.
  source_uri: "gs://project-9aed1f8e-f40e-4a15-858-models/data/raw/zomato_dataset.csv"
  raw_path: data/raw
  processed_path: data/processed
  train_test_split: 0.8
  random_state: 42
  val_split: 0.1
  # Temporal split configuration, this is only to mimic real-world data drift/eval
  temporal_baseline_days: 40 # First 40 days for train/val/test
  temporal_window_days: 7 # Weekly windows for drift detection
  temporal_train_ratio: 0.7 # 70% of baseline for training
  temporal_val_ratio: 0.15 # 15% of baseline for validation
  temporal_test_ratio: 0.15 # 15% of baseline for testing

features:
  haversine:
    lat_col1: Restaurant_latitude
    lon_col1: Restaurant_longitude
    lat_col2: Delivery_location_latitude
    lon_col2: Delivery_location_longitude

  # weekday:
  #   date_col: Order_Date
  #   weekday_end: 4

  # rush_hour:
  #   time_col: Time_Orderd
  hour_of_day:
    time_col: Time_Orderd

  day_of_week:
    date_col: Order_Date

logging:
  level: INFO
  output_dir: logs

paths:
  models_dir: models
  logs_dir: logs
  predictions_dir: predictions
